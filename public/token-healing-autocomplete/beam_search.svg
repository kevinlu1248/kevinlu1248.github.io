<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="60 0 490 320" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .node-label { font: 12px sans-serif; fill: #ffffff; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
      .edge { stroke: #6b7280; stroke-width: 2; }
      .edge-red { stroke: #ef4444; stroke-width: 3; }
      .edge-green { stroke: #22c55e; stroke-width: 3; }
      .edge-label-bg { fill: #111827; fill-opacity: 0.85; rx: 3; }
      .edge-label { font: 11px sans-serif; fill: #e5e7eb; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
      .node-border { stroke: #6b7280; stroke-width: 2; fill-opacity: 1; rx: 8; }
      .node-border-red { stroke: #ef4444; stroke-width: 3; fill-opacity: 1; rx: 8; }
      .node-border-green { stroke: #22c55e; stroke-width: 3; fill-opacity: 1; rx: 8; }
      .title { font: 14px sans-serif; fill: #a78bfa; font-weight: 700; }
      .path-label { font: 13px sans-serif; font-weight: 600; }
    </style>
  </defs>

  <!-- Title -->
  <text x="305" y="25" class="title" text-anchor="middle">Greedy vs Beam Search Example</text>

  <!-- Nodes (60x40 centered at (x,y)) and edges -->
  <!-- Root -->
  <rect x="290" y="45" width="60" height="40" class="node-border" fill="#374151" />
  <text x="320" y="65" class="node-label">START</text>

  <!-- Level 1 positions -->
  <!-- The (0.5) at (200,110) color hsl(120,80%,50%) -->
  <rect x="170" y="105" width="60" height="40" class="node-border-red" fill="hsl(120,80%,50%)" />
  <text x="200" y="125" class="node-label">The</text>

  <!-- A (0.3) at (440,110) color hsl(72,72%,46%) -->
  <rect x="410" y="105" width="60" height="40" class="node-border-green" fill="hsl(72,72%,46%)" />
  <text x="440" y="125" class="node-label">A</text>



  <!-- Edges from root to level 1 with labels -->
  <!-- Root -> The (0.50) -->
  <line x1="320" y1="85" x2="200" y2="105" class="edge-red" />
  <rect x="243" y="89" width="34" height="18" class="edge-label-bg" />
  <text x="260" y="98" class="edge-label">0.50</text>

  <!-- Root -> A (0.30) -->
  <line x1="320" y1="85" x2="440" y2="105" class="edge-green" />
  <rect x="363" y="89" width="34" height="18" class="edge-label-bg" />
  <text x="380" y="98" class="edge-label">0.30</text>



  <!-- Level 2 positions -->
  <!-- From The at (200,125) to cat (0.2) and dog (0.8) -->
  <!-- theCat (0.1) at (120,185) color hsl(24,64%,42%) -->
  <rect x="90" y="165" width="60" height="40" class="node-border" fill="hsl(24,64%,42%)" />
  <text x="120" y="185" class="node-label">cat</text>

  <!-- theDog (0.4) at (280,185) color hsl(96,76%,48%) -->
  <rect x="250" y="165" width="60" height="40" class="node-border-red" fill="hsl(96,76%,48%)" />
  <text x="280" y="185" class="node-label">dog</text>

  <!-- Edges from The -->
  <line x1="200" y1="145" x2="120" y2="165" class="edge" />
  <rect x="143" y="149" width="34" height="18" class="edge-label-bg" />
  <text x="160" y="158" class="edge-label">0.20</text>

  <line x1="200" y1="145" x2="280" y2="165" class="edge-red" />
  <rect x="223" y="149" width="34" height="18" class="edge-label-bg" />
  <text x="240" y="158" class="edge-label">0.80</text>

  <!-- From A at (440,125) to bird (0.9) and cat (0.1) -->
  <!-- aBird (0.27) at (360,185) color hsl(65,71%,45%) -->
  <rect x="330" y="165" width="60" height="40" class="node-border-green" fill="hsl(65,71%,45%)" />
  <text x="360" y="185" class="node-label">bird</text>

  <!-- aCat (0.03) at (520,185) color hsl(7,61%,41%) -->
  <rect x="490" y="165" width="60" height="40" class="node-border" fill="hsl(7,61%,41%)" />
  <text x="520" y="185" class="node-label">cat</text>

  <!-- Edges from A -->
  <line x1="440" y1="145" x2="360" y2="165" class="edge-green" />
  <rect x="383" y="149" width="34" height="18" class="edge-label-bg" />
  <text x="400" y="158" class="edge-label">0.90</text>

  <line x1="440" y1="145" x2="520" y2="165" class="edge" />
  <rect x="463" y="149" width="34" height="18" class="edge-label-bg" />
  <text x="480" y="158" class="edge-label">0.10</text>





  <!-- Level 3 positions -->
  <!-- theCat children - centered under parent at x=120 -->
  <!-- theCatSat (0.03) color hsl(7,61%,41%) -->
  <rect x="60" y="245" width="60" height="40" class="node-border" fill="hsl(7,61%,41%)" />
  <text x="90" y="265" class="node-label">sat</text>

  <!-- theCatSlept (0.07) color hsl(17,63%,41%) -->
  <rect x="130" y="245" width="60" height="40" class="node-border" fill="hsl(17,63%,41%)" />
  <text x="160" y="265" class="node-label">slept</text>

  <!-- edges from theCat -->
  <line x1="120" y1="205" x2="90" y2="245" class="edge" />
  <rect x="88" y="219" width="34" height="18" class="edge-label-bg" />
  <text x="105" y="228" class="edge-label">0.30</text>

  <line x1="120" y1="205" x2="160" y2="245" class="edge" />
  <rect x="123" y="219" width="34" height="18" class="edge-label-bg" />
  <text x="140" y="228" class="edge-label">0.70</text>

  <!-- theDog children - centered under parent at x=280 -->
  <!-- theDogRan (0.24) color hsl(58,70%,45%) -->
  <rect x="200" y="245" width="60" height="40" class="node-border" fill="hsl(58,70%,45%)" />
  <text x="230" y="265" class="node-label">ran</text>

  <!-- theDogBarked (0.16) color hsl(38,66%,43%) -->
  <rect x="270" y="245" width="60" height="40" class="node-border-red" fill="hsl(38,66%,43%)" />
  <text x="300" y="265" class="node-label">barked</text>

  <!-- edges from theDog -->
  <line x1="280" y1="205" x2="230" y2="245" class="edge" />
  <rect x="238" y="219" width="34" height="18" class="edge-label-bg" />
  <text x="255" y="228" class="edge-label">0.60</text>

  <line x1="280" y1="205" x2="300" y2="245" class="edge-red" />
  <rect x="273" y="219" width="34" height="18" class="edge-label-bg" />
  <text x="290" y="228" class="edge-label">0.40</text>

  <!-- aBird children - centered under parent at x=360 -->
  <!-- aBirdFlew (0.2565) color hsl(62,70%,45%) -->
  <rect x="340" y="245" width="60" height="40" class="node-border-green" fill="hsl(62,70%,45%)" />
  <text x="370" y="265" class="node-label">flew</text>

  <!-- aBirdSang (0.0135) color hsl(3,61%,40%) -->
  <rect x="410" y="245" width="60" height="40" class="node-border" fill="hsl(3,61%,40%)" />
  <text x="440" y="265" class="node-label">sang</text>

  <!-- edges from aBird -->
  <line x1="360" y1="205" x2="370" y2="245" class="edge-green" />
  <rect x="348" y="219" width="34" height="18" class="edge-label-bg" />
  <text x="365" y="228" class="edge-label">0.95</text>

  <line x1="360" y1="205" x2="440" y2="245" class="edge" />
  <rect x="383" y="219" width="34" height="18" class="edge-label-bg" />
  <text x="400" y="228" class="edge-label">0.05</text>

  <!-- aCat child - centered under parent at x=520 -->
  <!-- aCatPurred (0.03) color hsl(7,61%,41%) -->
  <rect x="490" y="245" width="60" height="40" class="node-border" fill="hsl(7,61%,41%)" />
  <text x="520" y="265" class="node-label">purred</text>

  <!-- edge from aCat -->
  <line x1="520" y1="205" x2="520" y2="245" class="edge" />
  <rect x="503" y="219" width="34" height="18" class="edge-label-bg" />
  <text x="520" y="228" class="edge-label">1.00</text>

  <!-- Path labels with percentages -->
  <text x="70" y="305" class="path-label" text-anchor="start" fill="#ef4444">Greedy: "The dog barked" (~16%)</text>
  <text x="540" y="305" class="path-label" text-anchor="end" fill="#22c55e">Beam: "A bird flew" (~26%)</text>

</svg>